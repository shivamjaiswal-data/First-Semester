<html>
<head>
    <title>Buttons</title>

    <style>
        .subscriber-button {
            background-color: rgb(200, 0, 0);
            color: white;
            border: none;
            height: 36px;
            width: 110px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }

        .join-button {
            background-color: white;
            color: rgb(0, 100, 200);
            border: 1px solid rgb(0, 100, 200);
            height: 36px;
            width: 70px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }

        .tweet-button {
            background-color: rgb(0, 140, 220);
            color: white;
            border: none;
            height: 36px;
            width: 80px;
            border-radius: 18px;
            cursor: pointer;
        }

        .subscriber-button:hover {
            opacity: 0.8;
        }

        .join-button:hover {
            background-color: rgb(0, 100, 200);
            color: white;
        }

        .tweet-button:hover {
            background-color: rgb(0, 120, 190);
        }
    </style>
</head>



    <button class="subscriber-button">SUBSCRIBE</button>

    <button class="join-button">JOIN</button>

    <button class="tweet-button">TWEET</button>


</html>
